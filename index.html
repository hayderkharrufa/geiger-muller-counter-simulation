<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Geiger–Müller Counter Simulation</title>
  <meta name="description" content="A free virtual lab for measuring alpha, beta and gamma radiation with a Geiger–Müller counter through lead, plastic and cardboard barriers.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☢️</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <header class="page-header">
    <div class="page-header__text">
      <h1>Geiger–Müller Counter Simulation</h1>
    </div>
  </header>

  <main class="lab">
    <section class="panel controls" aria-labelledby="controls-heading">
      <h2 id="controls-heading" class="visually-hidden">Experiment controls</h2>

      <div class="field">
        <label for="source">Radiation source</label>
        <select id="source">
          <option value="none">None (background)</option>
          <option value="barium">Ba-137m</option>
          <option value="alpha">α radiation</option>
          <option value="beta">β radiation</option>
          <option value="gamma">γ radiation</option>
          <option value="unknown">Unknown</option>
        </select>
      </div>

      <div class="field">
        <label for="barrier-type">Type of barrier</label>
        <select id="barrier-type">
          <option value="none">None</option>
          <option value="lead">Lead</option>
          <option value="plastic">Plastic</option>
          <option value="cardboard">Cardboard</option>
        </select>
      </div>

      <div class="field">
        <label for="barrier-count">Number of barriers</label>
        <select id="barrier-count" disabled>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4</option>
          <option value="5">5</option>
        </select>
      </div>

      <div class="field">
        <label for="duration">Count duration</label>
        <select id="duration">
          <option value="10">10 seconds</option>
          <option value="30">30 seconds</option>
          <option value="60">1 minute</option>
        </select>
      </div>

      <div class="buttons">
        <button type="button" id="start-count" class="button button--primary">Start Count</button>
        <button type="button" id="new-barium" class="button">New Ba-137 Source</button>
        <button type="button" id="new-experiment" class="button">New Experiment</button>
        <button type="button" id="toggle-timer" class="button">Show Timer</button>
      </div>

      <div id="timer" class="timer" hidden>
        <span class="timer__label">Timer</span>
        <output id="timer-display" class="timer__display">00:00.0</output>
      </div>

      <div class="progress" aria-hidden="true"><div id="progress-bar" class="progress__bar"></div></div>
      <p id="status" class="status" role="status" aria-live="polite"></p>

      <label class="checkbox">
        <input type="checkbox" id="sound">
        <span>Click sound for each count</span>
      </label>
    </section>

    <section class="panel apparatus-panel" aria-labelledby="apparatus-heading">
      <h2 id="apparatus-heading" class="visually-hidden">Apparatus</h2>
      <svg id="apparatus" class="apparatus" viewBox="0 0 360 384" role="img" aria-label="Radiation source below the barriers, with the Geiger–Müller tube above them, connected to a counter"></svg>
      <ul class="legend">
        <li><span class="swatch swatch--alpha"></span>α</li>
        <li><span class="swatch swatch--beta"></span>β</li>
        <li><span class="swatch swatch--gamma"></span>γ</li>
        <li><span class="swatch swatch--unknown"></span><span>Unknown</span></li>
      </ul>
      <p id="barium-age" class="barium-age" hidden>Time since Ba-137m source was prepared: <output id="barium-age-display">00:00</output></p>
    </section>
  </main>

  <footer class="page-footer">
    <p><a href="https://github.com/hayderkharrufa/geiger-muller-counter-simulation">Source on GitHub</a></p>
  </footer>
</body>
</html>
